services:
  mysql:
    image: mysql:8.4
    container_name: bookmyshow-local

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookmyshowdb
      MYSQL_USER: bookmyshowuser
      MYSQL_PASSWORD: bookmyshowpass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: